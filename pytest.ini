[pytest]
# Pytest configuration for perplexity-cli

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=perplexity
    --cov-report=term-missing
    --cov-report=html

# Coverage configuration
[coverage:run]
source = .
omit =
    tests/*
    */venv/*
    */virtualenv/*

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require network or external services)
    slow: Slow tests (marked for explicit running)
    api: Tests that interact with the Perplexity API
